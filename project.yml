name: TurkishScenes
options:
  bundleIdPrefix: dev.nextaura
  developmentLanguage: ar
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  TurkishScenes:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: App/GeneratedInfo.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        NSMicrophoneUsageDescription: "نستخدم الميكروفون خلال جلسة تعلم صوتية تبدأها بنفسك، لإرسال إجابتك إلى OpenAI وتصحيحها."
    sources:
      - path: App
        excludes:
          - Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.nextaura.turkishscenes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "لقطة تركية"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - TurkishScenesUITests
  TurkishScenesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: TurkishScenes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
