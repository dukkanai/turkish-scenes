# Internal preview with deterministic GA payloads and secret-safe diagnostics. No paid API calls in CI.
name: Internal TestFlight preview
on:
  push:
    branches: ['dev/ios-app-20261101']
    paths: ['.github/workflows/testflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turkish-scenes-internal-testflight
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    environment: turkish-scenes-testflight
    if: github.repository == 'dukkanai/turkish-scenes' && github.ref == 'refs/heads/dev/ios-app-20261101'
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Test audio curriculum, progress, playback and security contracts
        run: bash ci/check_audio.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate app icon
        run: swift tools/make_app_icon.swift
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -project TurkishScenes.xcodeproj -scheme TurkishScenes -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify Arabic bundle localization
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("build/DerivedData/Build/Products/Debug-iphonesimulator/TurkishScenes.app/Info.plist")
          info = plistlib.loads(p.read_bytes())
          assert info["CFBundleDevelopmentRegion"] == "ar", info.get("CFBundleDevelopmentRegion")
          assert "ar" in info["CFBundleLocalizations"]
          print("PASS: Arabic development language and supported localization")
          PY
      - name: Verify compiled app icon including optimized PNG
        run: python3 ci/check_app_bundle.py build/DerivedData/Build/Products/Debug-iphonesimulator/TurkishScenes.app
      - name: Run iPhone UI smoke test
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl create TurkishScenesCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project TurkishScenes.xcodeproj -scheme TurkishScenes -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test
      - name: Report scope
        run: echo 'Automated curriculum, state, playback-timeline and simulator checks only. Paid Realtime and real-device VoiceOver/audio acceptance remain unverified.'
      - name: Archive and upload internal preview
        env:
          TURKISH_ASC_PRIVATE_KEY_B64: ${{ secrets.TURKISH_ASC_PRIVATE_KEY_B64 }}
          TURKISH_DISTRIBUTION_P12_B64: ${{ secrets.TURKISH_DISTRIBUTION_P12_B64 }}
          TURKISH_DISTRIBUTION_P12_PASSWORD: ${{ secrets.TURKISH_DISTRIBUTION_P12_PASSWORD }}
          TURKISH_APP_STORE_PROFILE_B64: ${{ secrets.TURKISH_APP_STORE_PROFILE_B64 }}
        run: bash ci/testflight.sh
