name: Apple signing readiness
on:
  push:
    branches: ['dev/ios-app-20261101']
    paths: ['ci/apple_readiness.rb', '.github/workflows/apple-readiness.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    environment: turkish-scenes-testflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read Apple application and certificate metadata
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.TURKISH_ASC_PRIVATE_KEY_B64 }}
        run: ruby ci/apple_readiness.rb
