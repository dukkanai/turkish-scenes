name: iOS CI
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Test Turkish grading and session persistence
        run: |
          mkdir -p build
          swiftc App/PracticeCore.swift Tests/CoreChecks.swift -o build/core-checks
          build/core-checks
          swiftc App/PracticeCore.swift App/ProgressStore.swift Tests/ProgressChecks.swift -o build/progress-checks
          build/progress-checks
      - name: Test player security boundaries
        run: |
          bash -n ci/testflight.sh
          swiftc App/VideoPolicy.swift Tests/VideoPolicyChecks.swift -o build/video-policy-checks
          build/video-policy-checks
      - name: Test content converter
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Convert teaching source
        run: python3 tools/convert_content.py
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate app icon
        run: swift tools/make_app_icon.swift
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -project TurkishScenes.xcodeproj -scheme TurkishScenes -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify Arabic bundle localization
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("build/DerivedData/Build/Products/Debug-iphonesimulator/TurkishScenes.app/Info.plist")
          info = plistlib.loads(p.read_bytes())
          assert info["CFBundleDevelopmentRegion"] == "ar", info.get("CFBundleDevelopmentRegion")
          assert "ar" in info["CFBundleLocalizations"]
          print("PASS: Arabic development language and supported localization")
          PY
      - name: Run iPhone UI smoke test
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl create TurkishScenesCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project TurkishScenes.xcodeproj -scheme TurkishScenes -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 test
      - name: Report scope
        run: echo 'Simulator build only. Device, VoiceOver, live video and content editorial acceptance remain NOT_RUN.'
